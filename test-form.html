<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Smart Autofill — test form &amp; self-check</title>
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 520px; margin: 30px auto; }
      label { display: block; margin: 12px 0 4px; }
      input, textarea, select { width: 100%; padding: 6px; box-sizing: border-box; }
      #result { margin-top: 20px; padding: 10px; border-radius: 6px; white-space: pre-wrap;
                font: 13px ui-monospace, monospace; }
      .pass { background: #dcfce7; color: #166534; }
      .fail { background: #fee2e2; color: #991b1b; }
    </style>
  </head>
  <body>
    <h1>Test form</h1>
    <p>
      Open this file in Chrome to (a) run the extractFields self-check below, and
      (b) try the extension: click the toolbar icon → "Fill this form".
    </p>

    <form id="f">
      <!-- label via <label for> -->
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" />

      <!-- label via wrapping <label> -->
      <label>Full name
        <input type="text" name="fullname" />
      </label>

      <!-- label via aria-label -->
      <input type="tel" name="phone" aria-label="Phone number" />

      <!-- label via placeholder -->
      <input type="text" name="city" placeholder="City" />

      <!-- select with options -->
      <label for="relocate">Willing to relocate?</label>
      <select id="relocate" name="relocate">
        <option value="">— choose —</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <!-- custom dropdown (ARIA combobox + role=option list) — NOT a native <select>.
           This is the widget type Workday/Greenhouse/React-Select build. The extension
           opens it, waits for options, and clicks the match. -->
      <span id="country-lbl">Country</span>
      <div id="country" role="combobox" aria-haspopup="listbox" aria-expanded="false"
           aria-labelledby="country-lbl" tabindex="0"
           style="border:1px solid #999; padding:6px; cursor:pointer;">Select…</div>
      <ul id="country-list" role="listbox" hidden style="border:1px solid #ccc; margin:0; padding:0; list-style:none;">
        <li role="option" style="padding:6px; cursor:pointer;">United States</li>
        <li role="option" style="padding:6px; cursor:pointer;">United Kingdom</li>
        <li role="option" style="padding:6px; cursor:pointer;">Pakistan</li>
      </ul>

      <!-- radio group: question comes from the <legend> -->
      <fieldset>
        <legend>Available to start immediately?</legend>
        <label><input type="radio" name="startnow" value="yes" /> Yes</label>
        <label><input type="radio" name="startnow" value="no" /> No</label>
      </fieldset>

      <!-- textarea -->
      <label for="why">Why do you want this role?</label>
      <textarea id="why" name="why" rows="3"></textarea>

      <!-- should be SKIPPED: hidden + submit -->
      <input type="hidden" name="csrf" value="xyz" />
      <button type="submit">Submit</button>
    </form>

    <div id="result"></div>

    <!-- Wire the demo custom dropdown: click to open, click an option to select. -->
    <script>
      (function wireCombobox() {
        const cb = document.getElementById('country');
        const list = document.getElementById('country-list');
        const open = () => { list.hidden = false; cb.setAttribute('aria-expanded', 'true'); };
        const close = () => { list.hidden = true; cb.setAttribute('aria-expanded', 'false'); };
        cb.addEventListener('click', () => (list.hidden ? open() : close()));
        list.querySelectorAll('[role="option"]').forEach((opt) => {
          opt.addEventListener('click', () => { cb.textContent = opt.textContent; close(); });
        });
      })();
    </script>

    <!-- Reuse the exact functions the extension injects — no duplicated logic. -->
    <script src="inject.js"></script>
    <script>
      // Self-check: the smallest thing that fails if the DOM scan or label
      // resolution breaks. Asserts field count and that every label resolved.
      (function selfCheck() {
        const out = document.getElementById('result');
        const fields = extractFields();

        const checks = [];
        const expect = (name, cond) => checks.push({ name, ok: !!cond });

        expect('found exactly 9 fillable fields (hidden + submit skipped)', fields.length === 9);
        expect('every field resolved a non-empty label', fields.every((f) => f.label.length > 0));
        expect('email label reads "Email address"', fields.find((f) => f.name === 'email')?.label === 'Email address');
        expect('phone label came from aria-label', fields.find((f) => f.name === 'phone')?.label === 'Phone number');
        expect('city label came from placeholder', fields.find((f) => f.name === 'city')?.label === 'City');
        expect('relocate select exposes its options', (fields.find((f) => f.name === 'relocate')?.options || []).includes('Yes'));
        const country = fields.find((f) => f.id === 'country');
        expect('custom dropdown flagged as widget', country?.widget === true);
        expect('custom dropdown label via aria-labelledby', country?.label === 'Country');
        const startYes = fields.find((f) => f.name === 'startnow' && f.optionValue === 'yes');
        expect('radio label includes its group question', startYes?.label === 'Available to start immediately? — Yes');
        expect('radios carry a choiceGroup', startYes?.choiceGroup === 'startnow');
        expect('every field got a data-af-id', fields.every((f) => document.querySelector('[data-af-id="' + f.af_id + '"]')));

        const failed = checks.filter((c) => !c.ok);
        const lines = checks.map((c) => (c.ok ? '✓ ' : '✗ ') + c.name);
        out.className = failed.length ? 'fail' : 'pass';
        out.textContent =
          (failed.length ? failed.length + ' CHECK(S) FAILED\n\n' : 'ALL CHECKS PASSED\n\n') +
          lines.join('\n');

        // Also assert in the console so it shows up in automated/dev runs.
        console.assert(failed.length === 0, 'extractFields self-check failed:', failed);
      })();
    </script>
  </body>
</html>
